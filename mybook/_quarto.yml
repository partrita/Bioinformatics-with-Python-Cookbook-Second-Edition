project:
  type: book
  output-dir: _book

book:
  title: "Bioinformatics with Python Cookbook"
  author: "Tiago Antao"
  chapters:
    - index.qmd
    - part: "Chapter 1: R과 연동하기"
      chapters:
        - file: Chapter01/Interfacing_R.ipynb
          text: "R 인터페이싱 (rpy2)"
        - file: Chapter01/R_magic.ipynb
          text: "R 매직 커맨드 활용"
    - part: "Chapter 2: 차세대 서열 분석 (NGS)"
      chapters:
        - file: Chapter02/Working_with_FASTQ.ipynb
          text: "FASTQ 데이터 처리"
        - file: Chapter02/Working_with_BAM.ipynb
          text: "BAM 및 정렬 데이터 분석"
        - file: Chapter02/Working_with_VCF.ipynb
          text: "VCF 파일을 이용한 변이 분석"
        - file: Chapter02/Filtering_SNPs.ipynb
          text: "SNP 필터링 및 품질 관리"
        - file: Chapter02/Processing_BED_with_HTSeq.ipynb
          text: "HTSeq 활용 (BED 처리)"
        - file: Chapter02/Accessing_Databases.ipynb
